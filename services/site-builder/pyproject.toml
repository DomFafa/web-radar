[project]
name = "web-radar-site-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6,<0.116", "uvicorn>=0.25,<1", "beautifulsoup4>=4.12,<5",
  "tinycss2>=1.4,<2", "pillow>=10.3,<13", "openai==2.16.0",
  "anthropic>=0.84,<1", "google-genai>=1.16,<2", "httpx>=0.28,<1",
  "python-dotenv>=1,<2", "aiohttp>=3.9,<4", "playwright>=1.61,<2",
  "pillow-heif>=0.18,<2", "langfuse>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pyright>=1.1.400", "types-beautifulsoup4", "types-tinycss2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["app.py", "builder.py", "assembler.py", "renderer.py", "design_assets.py", "visual_plan.py", "generated_assets.py", "presentation_labels.py", "tests"]
typeCheckingMode = "basic"
extraPaths = ["../../screenshot-to-code-main/backend"]
