<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4461a4"/>
      <stop offset="100%" stop-color="#7590c3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7590c3" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgGrad)"/>

  <g opacity="0.12" stroke="#475569" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="420" y1="0" x2="420" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="420" x2="600" y2="420"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
  </g>

  <circle cx="300" cy="270" r="180" fill="url(#orbGrad)" opacity="0.18" filter="url(#glow)"/>
  <circle cx="300" cy="270" r="160" fill="none" stroke="#4461a4" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="300" cy="270" r="130" fill="none" stroke="#7590c3" stroke-width="1.5" opacity="0.5"/>

  <rect x="140" y="110" width="320" height="320" rx="28" fill="#ffffff" fill-opacity="0.88" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)"/>

  <g transform="translate(300, 160)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#fff7ed" fill-opacity="0.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#4461a4" text-anchor="middle" letter-spacing="1.5">CATEGORY EXAMPLE</text>
  </g>

  <rect x="243" y="215" width="115" height="138" rx="7" fill="#7590c3"/><rect x="256" y="226" width="89" height="113" rx="2" fill="#fffdf5"/><path d="M270 250h60m-60 20h60m-60 20h60m-60 20h40" stroke="#bac8df" stroke-width="4"/><path d="M251 225v113" stroke="#4461a4" stroke-width="8"/>

  <text x="300" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#0f172a" text-anchor="middle">Notebook</text>

  <g transform="translate(300, 500)" text-anchor="middle">
    <rect x="-160" y="-22" width="320" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" letter-spacing="0.5">ILLUSTRATION ONLY - NO SPECIFICATIONS</text>
  </g>

  <circle cx="510" cy="90" r="32" fill="#7590c3"/>
  <text x="510" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">DEMO</text>
  <text x="510" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">ONLY</text>
</svg>